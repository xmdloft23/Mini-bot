<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOFT XMD — PRE RELEASE</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #06030a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(109, 40, 217, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(168, 85, 247, 0.12), transparent 45%);
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: #0d0716;
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .gradient-text {
      background: linear-gradient(135deg, #a78bfa, #d946ef);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.25);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c4b5fd;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
    }

    .input-field {
      width: 100%;
      background: #140b22;
      border: 1.5px solid rgba(139, 92, 246, 0.22);
      border-radius: 12px;
      padding: 13px 16px;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .input-field::placeholder { color: rgba(196, 181, 253, 0.3); }
    .input-field:focus {
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #6d28d9, #a855f7);
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .copy-box {
      cursor: pointer;
      background: #140b22;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 16px;
      transition: border-color 0.2s, background 0.2s;
    }
    .copy-box:hover {
      border-color: rgba(168, 85, 247, 0.5);
      background: #1a0f2e;
    }

    /* ═══════════════════════════════════════
       LOADING ANIMATION
    ═══════════════════════════════════════ */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 3, 10, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .loading-overlay.active {
      display: flex;
      opacity: 1;
    }

    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 40px;
      background: #0d0716;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Triple ring spinner */
    .spinner {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .spinner-ring:nth-child(1) {
      border-top-color: #a78bfa;
      animation: spin 1.2s linear infinite;
    }
    .spinner-ring:nth-child(2) {
      inset: 8px;
      border-right-color: #d946ef;
      animation: spin 1.6s linear infinite reverse;
    }
    .spinner-ring:nth-child(3) {
      inset: 16px;
      border-bottom-color: #7c3aed;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Center pulse dot */
    .spinner-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: #c4b5fd;
      animation: corePulse 1.2s ease-in-out infinite;
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .loading-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #c4b5fd;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .loading-dots span {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #a78bfa;
      margin: 0 2px;
      animation: dotBounce 1.4s infinite ease-in-out;
    }
    .loading-dots span:nth-child(1) { animation-delay: 0s; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .loading-sub {
      font-size: 9px;
      color: rgba(196, 181, 253, 0.4);
      letter-spacing: 0.15em;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* small inline loader (on button) */
    .btn-loader {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; }

    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- ICON + BADGE -->
    <div style="text-align:center; margin-bottom:16px;">
      <div style="width:64px;height:64px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,rgba(109,40,217,0.25),rgba(168,85,247,0.15));border:1px solid rgba(139,92,246,0.3);display:flex;align-items:center;justify-content:center;">
        <i class="fas fa-bolt gradient-text" style="font-size:26px;"></i>
      </div>
      <div class="badge">
        <span class="dot"></span> PRE RELEASE
      </div>
    </div>

    <!-- TITLE -->
    <h1 style="text-align:center;font-size:32px;font-weight:900;margin:14px 0 6px;letter-spacing:-0.02em;" class="gradient-text">
      LOFT XMD
    </h1>
    <p style="text-align:center;font-size:10px;color:rgba(196,181,253,0.35);letter-spacing:0.25em;text-transform:uppercase;font-weight:600;margin:0 0 22px;">
      Quantum Series · 2026
    </p>

    <!-- DIVIDER -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <div style="flex:1;height:1px;background:rgba(139,92,246,0.15);"></div>
      <span style="font-size:9px;color:rgba(196,181,253,0.35);letter-spacing:0.2em;text-transform:uppercase;font-weight:700;">Secure Pairing</span>
      <div style="flex:1;height:1px;background:rgba(139,92,246,0.15);"></div>
    </div>

    <!-- FORM -->
    <div style="display:flex;flex-direction:column;gap:12px;">
      <input
        id="number"
        type="number"
        placeholder="+255xxxxxxxxx"
        class="input-field"
      />
      <button id="submit" class="btn-primary">
        <span id="btn-text">GENERATE CODE</span>
      </button>
    </div>

    <!-- OUTPUT -->
    <main id="pair" style="margin-top:4px;"></main>

    <!-- FOOTER -->
    <p style="text-align:center;font-size:9px;color:rgba(196,181,253,0.2);letter-spacing:0.2em;text-transform:uppercase;margin:22px 0 0;font-weight:600;">
      Powered by Sir LOFT · v7.0.0
    </p>

  </div>

  <!-- ═══════════════════════════════════════
       FULLSCREEN LOADING OVERLAY
  ═══════════════════════════════════════ -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-box">
      <div class="spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-core"></div>
      </div>
      <div class="loading-text">
        PROCESSING
        <span class="loading-dots">
          <span></span><span></span><span></span>
        </span>
      </div>
      <div class="loading-sub">Securing connection</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const pairOutput = document.getElementById("pair");
    const submitBtn = document.getElementById("submit");
    const btnText = document.getElementById("btn-text");
    const inputNum = document.getElementById("number");
    const loadingOverlay = document.getElementById("loading-overlay");

    function showLoading() {
      loadingOverlay.classList.add('active');
    }
    function hideLoading() {
      loadingOverlay.classList.remove('active');
    }

    async function Copy() {
      const obj = document.getElementById("copy");
      if (!obj) return;
      const original = obj.innerHTML;
      const code = obj.querySelector('.copy-code')?.textContent || '';

      try {
        await navigator.clipboard.writeText(code);
        obj.innerHTML = `<span style="color:#4ade80;font-weight:800;font-size:13px;"><i class="fas fa-check"></i> COPIED</span>`;
        setTimeout(() => { obj.innerHTML = original; }, 1500);
      } catch {
        obj.innerHTML = `<span style="color:#f87171;font-size:12px;">Copy failed</span>`;
        setTimeout(() => { obj.innerHTML = original; }, 1500);
      }
    }

    submitBtn.addEventListener("click", async () => {
      const numVal = inputNum.value.trim();

      if (!numVal) {
        pairOutput.innerHTML = `<div class="fade-in" style="margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#f87171;font-size:12px;font-weight:600;text-align:center;">Enter your phone number</div>`;
        return;
      }

      const cleanNum = numVal.replace(/[^0-9]/g, "");

      if (cleanNum.length < 11) {
        pairOutput.innerHTML = `<div class="fade-in" style="margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#f87171;font-size:12px;font-weight:600;text-align:center;">Invalid number format</div>`;
        return;
      }

      inputNum.type = "text";
      inputNum.value = "+" + cleanNum;
      pairOutput.innerHTML = '';
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="btn-loader"></span>';

      // Show fullscreen loading overlay
      showLoading();

      try {
        const { data } = await axios(`/code?number=${cleanNum}`);
        const code = data.code || `U${Math.random().toString(36).substr(2, 6).toUpperCase()}`;

        // Keep loading visible for a minimum time so it doesn't flash
        await new Promise(r => setTimeout(r, 800));

        hideLoading();
        submitBtn.disabled = false;
        btnText.textContent = 'GENERATE CODE';

        pairOutput.innerHTML = `
          <div class="fade-in" style="margin-top:18px;">
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;">
              <div style="width:24px;height:24px;border-radius:50%;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);display:flex;align-items:center;justify-content:center;">
                <i class="fas fa-check" style="font-size:10px;color:#4ade80;"></i>
              </div>
              <span style="color:#4ade80;font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;">Pairing Complete</span>
            </div>

            <div id="copy" onclick="Copy()" class="copy-box">
              <div style="font-size:9px;color:rgba(196,181,253,0.4);letter-spacing:0.2em;text-transform:uppercase;font-weight:700;margin-bottom:6px;">Your Code</div>
              <div class="copy-code gradient-text" style="font-size:22px;font-weight:900;letter-spacing:0.08em;">${code}</div>
            </div>

            <div style="text-align:center;font-size:10px;color:rgba(196,181,253,0.3);margin-top:10px;letter-spacing:0.1em;">
              <i class="fas fa-copy"></i> Tap to copy
            </div>
          </div>
        `;
      } catch {
        await new Promise(r => setTimeout(r, 500));
        hideLoading();
        submitBtn.disabled = false;
        btnText.textContent = 'GENERATE CODE';
        pairOutput.innerHTML = `<div class="fade-in" style="margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#f87171;font-size:12px;font-weight:600;text-align:center;">Connection failed · Retry</div>`;
      }
    });

    inputNum.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });
  </script>
</body>
</html>
